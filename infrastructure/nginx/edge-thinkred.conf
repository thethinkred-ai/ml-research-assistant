# Edge-фрагменты для server-блока thinkred.ru (внешний nginx на VPS).
# Соответствуют текущему размещению: страница — https://thinkred.ru/assistant/,
# модель — https://thinkred.ru/api/... (Base URL "/api" в UI уже настроен так).

# Страница ассистента (контейнер frontend, docker compose)
location /assistant/ {
    proxy_pass http://127.0.0.1:8088/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    add_header Cache-Control "public, max-age=600";
}

# LLM-прокси (контейнер api). Тот же origin → без CORS и с совместимым CSP.
location /api/ {
    proxy_pass http://127.0.0.1:8787/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 180s;
    proxy_send_timeout 60s;
}
