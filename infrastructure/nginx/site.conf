# Конфиг nginx внутри контейнера frontend (статика + прокси /api/ на api-контейнер).
# Позволяет разворачивать приложение целиком на одном порту (http://127.0.0.1:8088/).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA без сборки — отдаём файлы как есть
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # LLM-прокси в той же origin (режим «без ключа» в UI: Base URL = /api)
    location /api/ {
        proxy_pass http://api:8787/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;
    }
}
